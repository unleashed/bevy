[package]
name = "bevy_text"
version = "0.20.0"
edition = "2024"
description = "Provides text functionality for Bevy Engine"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]

[features]
default_font = []
system_font_discovery = ["parley/system"]
system_clipboard = ["bevy_clipboard/system_clipboard"]
complex_script_segmentation = ["parley/complex-scripts"]
# Scale glyph outlines by 64/60 before rasterising, as Godot 4.7.2 does.
legacy_glyph_weight = []

[dependencies]
# bevy, from crates.io rather than by path so a `[patch]` by git replaces only bevy_text
bevy_app = { version = "0.20.0" }
bevy_asset = { version = "0.20.0" }
bevy_clipboard = { version = "0.20.0", default-features = false }
bevy_color = { version = "0.20.0" }
bevy_derive = { version = "0.20.0" }
bevy_ecs = { version = "0.20.0" }
bevy_image = { version = "0.20.0" }
bevy_log = { version = "0.20.0" }
bevy_math = { version = "0.20.0" }
bevy_reflect = { version = "0.20.0", features = [
  "smol_str",
] }
bevy_utils = { version = "0.20.0" }
bevy_platform = { version = "0.20.0", default-features = false, features = [
  "std",
  "serialize",
] }

# other
wgpu-types = { version = "30", default-features = false }
thiserror = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
smallvec = { version = "1", default-features = false }
smol_str = { version = "0.2", default-features = false }
sys-locale = "0.3.0"
tracing = { version = "0.1", default-features = false, features = ["std"] }
parley = { version = "0.11.0", default-features = false, features = ["std"] }
swash = { version = "0.2.6" }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
