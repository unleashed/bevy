[package]
name = "bevy_sprite_render"
version = "0.20.1"
edition = "2024"
description = "Provides sprite rendering functionality for Bevy Engine"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]

[features]
webgl = []
webgpu = []
bevy_text = ["dep:bevy_text", "bevy_sprite/bevy_text"]

[dependencies]
# bevy, from crates.io rather than by path so a `[patch]` by git replaces only bevy_sprite_render
bevy_app = { version = "0.20.0" }
bevy_asset = { version = "0.20.0" }
bevy_color = { version = "0.20.0" }
bevy_core_pipeline = { version = "0.20.0" }
bevy_ecs = { version = "0.20.0" }
bevy_extract = { version = "0.20.0" }
bevy_image = { version = "0.20.0" }
bevy_camera = { version = "0.20.0" }
bevy_mesh = { version = "0.20.0" }
bevy_math = { version = "0.20.0" }
bevy_shape = { version = "0.20.0" }
bevy_shader = { version = "0.20.0" }
bevy_material = { version = "0.20.0" }
bevy_sprite = { version = "0.20.0" }
bevy_text = { version = "0.20.0", optional = true }
bevy_reflect = { version = "0.20.0" }
bevy_render = { version = "0.20.0" }
bevy_transform = { version = "0.20.0" }
bevy_utils = { version = "0.20.0" }
bevy_derive = { version = "0.20.0" }
bevy_platform = { version = "0.20.0", default-features = false, features = [
  "std",
] }

# other
bytemuck = { version = "1", features = ["derive", "must_cast"] }
fixedbitset = "0.5"
derive_more = { version = "2", default-features = false, features = ["from"] }
bitflags = "2.3"
nonmax = "0.5"
tracing = { version = "0.1", default-features = false, features = ["std"] }
smallvec = { version = "1", default-features = false }
static_assertions = "1"

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true

[package.metadata.wgsl-analyzer]
edition = "2026_pre"
root = "src"

[package.metadata.wgsl-analyzer.dependencies]
bevy_render = { path = "../bevy_render" }
bevy_core_pipeline = { path = "../bevy_core_pipeline" }
